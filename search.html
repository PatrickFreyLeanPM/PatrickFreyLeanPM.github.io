---
layout: default
title: Search
---
<div class="search-page">
  <h1 class="page-heading">Search</h1>

  <div class="search-input-wrapper">
    <input type="text" id="search-input" class="search-input" placeholder="Search posts, books, concepts, methods..." autofocus>
  </div>

  <div id="search-results" class="search-results" role="status" aria-live="polite" aria-label="Search results"></div>
</div>

<script src="https://unpkg.com/lunr@2.3.9/lunr.min.js"></script>
<script>
(function () {
  var searchInput = document.getElementById('search-input');
  var resultsContainer = document.getElementById('search-results');
  var documents = [];
  var index;

  // Load the search index
  fetch('{{ "/search.json" | relative_url }}')
    .then(function (response) { return response.json(); })
    .then(function (data) {
      documents = data;
      index = lunr(function () {
        this.ref('url');
        this.field('title', { boost: 10 });
        this.field('content');
        this.field('type', { boost: 2 });

        data.forEach(function (doc) {
          this.add(doc);
        }, this);
      });

      // Check for query parameter
      var params = new URLSearchParams(window.location.search);
      var query = params.get('q');
      if (query) {
        searchInput.value = query;
        performSearch(query);
      }
    });

  searchInput.addEventListener('input', function () {
    var query = this.value.trim();
    if (query.length < 2) {
      resultsContainer.innerHTML = '';
      return;
    }
    performSearch(query);
  });

  function performSearch(query) {
    var results;
    try {
      results = index.search(query + '~1');
    } catch (e) {
      try {
        results = index.search(query);
      } catch (e2) {
        resultsContainer.innerHTML = '<p class="search-no-results">Invalid search query.</p>';
        return;
      }
    }

    if (results.length === 0) {
      resultsContainer.innerHTML = '<p class="search-no-results">No results found for "<strong>' +
        escapeHtml(query) + '</strong>".</p>';
      return;
    }

    var html = '<p class="search-result-count">' + results.length + ' result' +
      (results.length === 1 ? '' : 's') + ' for "<strong>' + escapeHtml(query) + '</strong>"</p>';

    results.forEach(function (result) {
      var doc = documents.find(function (d) { return d.url === result.ref; });
      if (!doc) return;

      var snippet = getSnippet(doc.content, query);

      html += '<div class="search-result-item">';
      html += '<span class="search-result-type">' + escapeHtml(doc.type) + '</span>';
      if (doc.date) {
        html += '<span class="search-result-date"> &middot; ' + escapeHtml(doc.date) + '</span>';
      }
      html += '<h2 class="search-result-title"><a href="' + doc.url + '">' + escapeHtml(doc.title) + '</a></h2>';
      html += '<p class="search-result-snippet">' + snippet + '</p>';
      html += '</div>';
    });

    resultsContainer.innerHTML = html;
  }

  function getSnippet(content, query) {
    var words = query.toLowerCase().split(/\s+/);
    var text = content || '';
    var lower = text.toLowerCase();
    var pos = -1;

    for (var i = 0; i < words.length; i++) {
      pos = lower.indexOf(words[i]);
      if (pos !== -1) break;
    }

    var start = Math.max(0, pos - 100);
    var end = Math.min(text.length, pos + 200);
    var snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '');

    return escapeHtml(snippet);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
})();
</script>
